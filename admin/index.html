<title>Open Studio Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Syne:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d0c0a;
    --surface:#14190f;
    --surface-raised:#1b2317;
    --forest:#2d6b3a;
    --moss:#5c9464;
    --paper:#f0ece3;
    --muted:rgba(240,236,227,.56);
    --faint:rgba(240,236,227,.34);
    --line:rgba(240,236,227,.1);
    --line-strong:rgba(240,236,227,.18);
    --gold:#c3993f;
    --gold-dim:rgba(195,153,63,.12);
    --focus:#4fd68c;
    --danger:#c05a4a;
    --font-display:'Cormorant Garamond', Georgia, serif;
    --font-ui:'Syne', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{ box-sizing:border-box; }
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }
  button, input, select{ font:inherit; }

  .page{ max-width:980px; margin:0 auto; padding:36px 20px 70px; }

  .masthead{ display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .masthead svg{ width:26px; height:auto; display:block; }
  .masthead h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    letter-spacing:.04em;
    margin:0;
    color:var(--paper);
  }
  .masthead .tag{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--moss);
    margin-left:auto;
  }

  .view{ display:none; }
  .view.active{ display:block; }

  /* login */
  .login-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px;
    max-width:360px;
    margin:60px auto 0;
  }
  .login-card h2{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:600;
    font-size:22px;
    margin:0 0 20px;
    text-align:center;
    color:var(--paper);
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--faint);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    background:var(--surface-raised);
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:10px 12px;
    color:var(--paper);
    font-size:14px;
  }
  .field input:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  button.primary{
    width:100%;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    background:var(--gold);
    border:1px solid var(--gold);
    border-radius:8px;
    padding:11px 20px;
    cursor:pointer;
    margin-top:6px;
  }
  button.primary:disabled{ background:var(--surface-raised); color:var(--faint); border-color:var(--line); cursor:not-allowed; }
  .error-msg{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--danger);
    margin:10px 0 0;
    display:none;
    text-align:center;
  }
  .error-msg.show{ display:block; }

  /* dashboard */
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:16px;
  }
  .toolbar input[type="search"]{
    flex:1;
    min-width:160px;
    background:var(--surface-raised);
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:9px 12px;
    color:var(--paper);
    font-size:13px;
  }
  button.ghost{
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:9px 14px;
    cursor:pointer;
    white-space:nowrap;
  }
  button.ghost:hover{ color:var(--paper); border-color:var(--moss); }

  .count{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--faint);
    margin:0 0 10px;
  }

  .tablecard{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .tablescroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; min-width:720px; }
  thead th{
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--faint);
    text-align:left;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{
    font-family:var(--font-mono);
    font-size:12px;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(240,236,227,.03); }
  td.name{ font-family:var(--font-ui); font-weight:600; color:var(--paper); white-space:nowrap; }
  td.times{ color:var(--muted); max-width:320px; }
  td.times .t{ display:block; }
  td.when{ color:var(--faint); white-space:nowrap; }
  select.status{
    background:var(--surface-raised);
    border:1px solid var(--line-strong);
    border-radius:6px;
    color:var(--paper);
    font-size:11.5px;
    padding:5px 7px;
  }
  select.status[data-status="New"]{ color:var(--moss); border-color:var(--moss); }
  select.status[data-status="Closed"]{ color:var(--faint); }

  .empty, .loading{
    padding:40px 20px;
    text-align:center;
    font-family:var(--font-mono);
    font-size:12.5px;
    color:var(--faint);
  }

  @media (max-width:560px){
    .login-card{ margin-top:30px; padding:22px; }
  }
</style>

<div class="page">
  <div class="masthead">
    <svg viewBox="0 0 294.8 172.36" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="a-g0" x1="72.71" y1="9.62" x2="38.71" y2="127.62" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#009444"/><stop offset="1" stop-color="#006838"/>
        </linearGradient>
        <linearGradient id="a-g1" x1="145.67" y1="30.64" x2="111.67" y2="148.64" xlink:href="#a-g0"/>
        <linearGradient id="a-g2" x1="212.36" y1="49.86" x2="178.36" y2="167.86" xlink:href="#a-g0"/>
      </defs>
      <path fill="url(#a-g0)" stroke="#231f20" stroke-miterlimit="10" stroke-width=".5" d="M33.53,30.32h31.21v122.2h-31.21V30.32Z"/>
      <path fill="url(#a-g1)" stroke="#231f20" stroke-miterlimit="10" stroke-width=".5" d="M119.44,30.32h-24.61l-23.04,57.4v64.81h7.51l6.44-17.67h42.44l5.95,17.67h33.85L119.44,30.32ZM94.33,110.08l12.55-41.78h.5l12.55,41.78h-25.6Z"/>
      <path fill="url(#a-g2)" stroke="#231f20" stroke-miterlimit="10" stroke-width=".5" d="M200.21,127.42c-20.31,0-32.86-17.84-32.86-36.33,0-17.34,11.73-35.67,32.7-35.67,16.84,0,26.09,12.22,29.56,21.3h32.7c-3.3-19.16-23.78-48.72-62.09-48.72-29.4,0-50.22,17.34-59.17,38.93l32.72,82.36c7.97,3.53,16.98,5.54,26.78,5.54,29.56,0,54.66-19.16,61.76-48.06h-32.7c-1.98,4.29-9.91,20.64-29.4,20.64Z"/>
    </svg>
    <h1>Open Studio</h1>
    <span class="tag">Admin</span>
  </div>

  <section class="view active" id="view-login">
    <div class="login-card">
      <h2>Sign in</h2>
      <div class="field">
        <label for="inp-email">Email</label>
        <input id="inp-email" type="email" autocomplete="username">
      </div>
      <div class="field">
        <label for="inp-password">Password</label>
        <input id="inp-password" type="password" autocomplete="current-password">
      </div>
      <button class="primary" id="btn-login" type="button">Sign in</button>
      <p class="error-msg" id="login-error">Couldn't sign in with those details.</p>
    </div>
  </section>

  <section class="view" id="view-dashboard">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search name or email&hellip;">
      <button class="ghost" id="btn-export" type="button">Export CSV</button>
      <button class="ghost" id="btn-signout" type="button">Sign out</button>
    </div>
    <p class="count" id="count-label">Loading&hellip;</p>
    <div class="tablecard">
      <div class="tablescroll">
        <table id="subs-table" hidden>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Preferred times</th>
              <th>Status</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="subs-body"></tbody>
        </table>
        <div class="loading" id="loading-state">Loading submissions&hellip;</div>
        <div class="empty" id="empty-state" hidden>No submissions yet.</div>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://urvxgsdzwbppbvgsahvf.supabase.co";
  var SUPABASE_KEY = "sb_publishable_Ft4LO2lgBgR3w7mgEEV8KQ_-FKe0HVb";
  var sb = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

  var viewLogin = document.getElementById("view-login");
  var viewDash = document.getElementById("view-dashboard");
  var inpEmail = document.getElementById("inp-email");
  var inpPassword = document.getElementById("inp-password");
  var btnLogin = document.getElementById("btn-login");
  var loginError = document.getElementById("login-error");
  var btnSignout = document.getElementById("btn-signout");
  var searchInput = document.getElementById("search");
  var btnExport = document.getElementById("btn-export");
  var countLabel = document.getElementById("count-label");
  var table = document.getElementById("subs-table");
  var tbody = document.getElementById("subs-body");
  var loadingState = document.getElementById("loading-state");
  var emptyState = document.getElementById("empty-state");

  var rows = [];

  function showView(id){
    [viewLogin, viewDash].forEach(function(v){ v.classList.toggle("active", v.id === id); });
  }

  function formatTimes(times){
    if (!times || !times.length) return "(no times picked)";
    return times.map(function(t){ return t.day + " · " + t.bucket + " (" + t.range + ")"; }).join(", ");
  }

  function formatDate(iso){
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }) +
      " " + d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
  }

  function render(){
    var q = searchInput.value.trim().toLowerCase();
    var filtered = rows.filter(function(r){
      if (!q) return true;
      return (r.name || "").toLowerCase().indexOf(q) !== -1 ||
             (r.email || "").toLowerCase().indexOf(q) !== -1;
    });

    countLabel.textContent = filtered.length + (filtered.length === 1 ? " submission" : " submissions") +
      (q ? " matching “" + searchInput.value.trim() + "”" : "");

    tbody.innerHTML = "";
    if (!filtered.length){
      table.hidden = true;
      loadingState.hidden = true;
      emptyState.hidden = false;
      return;
    }
    loadingState.hidden = true;
    emptyState.hidden = true;
    table.hidden = false;

    filtered.forEach(function(r){
      var tr = document.createElement("tr");

      var tdName = document.createElement("td");
      tdName.className = "name";
      tdName.textContent = r.name || "—";
      tr.appendChild(tdName);

      var tdEmail = document.createElement("td");
      tdEmail.textContent = r.email || "—";
      tr.appendChild(tdEmail);

      var tdTimes = document.createElement("td");
      tdTimes.className = "times";
      tdTimes.textContent = formatTimes(r.preferred_times);
      tr.appendChild(tdTimes);

      var tdStatus = document.createElement("td");
      var select = document.createElement("select");
      select.className = "status";
      select.setAttribute("data-status", r.status);
      ["New", "Contacted", "Closed"].forEach(function(s){
        var opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        if (s === r.status) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener("change", function(){
        var newStatus = select.value;
        select.disabled = true;
        sb.from("submissions").update({ status: newStatus }).eq("id", r.id).then(function(res){
          select.disabled = false;
          if (!res.error){
            r.status = newStatus;
            select.setAttribute("data-status", newStatus);
          }
        });
      });
      tdStatus.appendChild(select);
      tr.appendChild(tdStatus);

      var tdWhen = document.createElement("td");
      tdWhen.className = "when";
      tdWhen.textContent = formatDate(r.created_at);
      tr.appendChild(tdWhen);

      tbody.appendChild(tr);
    });
  }

  function loadSubmissions(){
    loadingState.hidden = false;
    emptyState.hidden = true;
    table.hidden = true;
    sb.from("submissions").select("*").order("created_at", { ascending:false }).then(function(res){
      if (res.error){
        loadingState.textContent = "Couldn't load submissions.";
        return;
      }
      rows = res.data || [];
      render();
    });
  }

  searchInput.addEventListener("input", render);

  btnExport.addEventListener("click", function(){
    var header = ["Name","Email","Preferred Times","Status","Submitted"];
    var lines = [header.join(",")];
    rows.forEach(function(r){
      var cells = [
        r.name || "",
        r.email || "",
        formatTimes(r.preferred_times),
        r.status || "",
        formatDate(r.created_at)
      ].map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; });
      lines.push(cells.join(","));
    });
    var blob = new Blob([lines.join("\n")], { type:"text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "open-studio-submissions.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  btnLogin.addEventListener("click", function(){
    if (!sb) return;
    loginError.classList.remove("show");
    btnLogin.disabled = true;
    sb.auth.signInWithPassword({
      email: inpEmail.value.trim(),
      password: inpPassword.value
    }).then(function(res){
      btnLogin.disabled = false;
      if (res.error){
        loginError.classList.add("show");
        return;
      }
      showView("view-dashboard");
      loadSubmissions();
    });
  });
  inpPassword.addEventListener("keydown", function(e){ if (e.key === "Enter") btnLogin.click(); });

  btnSignout.addEventListener("click", function(){
    if (!sb) return;
    sb.auth.signOut().then(function(){
      showView("view-login");
      inpPassword.value = "";
    });
  });

  // ---------- init: resume an existing session, if any ----------
  if (sb){
    sb.auth.getSession().then(function(res){
      if (res.data && res.data.session){
        showView("view-dashboard");
        loadSubmissions();
      }
    });
  }
})();
</script>
